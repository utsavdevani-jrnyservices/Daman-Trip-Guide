# Deploys the app to GitHub Pages on every push to the listed branches.
# No manual setup: the configure-pages step enables Pages on first run. Then this
# runs on every push, or manually from the Actions tab via "Run workflow".
# Live URL: https://utsavdevani-jrnyservices.github.io/Daman-Trip-Guide/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, ccr-742efe2b-kmf2vh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true # creates the Pages site on first run, no manual setup needed
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
